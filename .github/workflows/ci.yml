name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libsystemd-dev

      - name: Build
        env:
          CC: ${{ matrix.cc }}
        run: make CFLAGS="-O2 -Wall -Wextra -Werror -std=gnu11"

      - name: Smoke test
        run: |
          ./wechat_tray_watch --help
          set +e
          ./wechat_tray_watch --bogus >/dev/null 2>&1
          rc=$?
          test "$rc" -eq 2
