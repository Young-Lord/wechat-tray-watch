name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libsystemd-dev

      - name: Build
        run: |
          make CFLAGS="-O2 -Wall -Wextra -Werror -std=gnu11"
          mkdir -p dist
          cp wechat_tray_watch "dist/wechat_tray_watch-linux-${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish rolling ci release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          git tag -f ci
          git push -f origin ci
          if gh release view ci >/dev/null 2>&1; then
            gh release delete ci --yes --cleanup-tag=false
          fi
          gh release create ci dist/* --latest --title ci \
            --notes "Automated build of ${GITHUB_SHA} ($(date -u +%FT%TZ))"
